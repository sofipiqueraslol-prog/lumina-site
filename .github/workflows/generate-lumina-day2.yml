name: Generate LUMINA Day 2 natural voice video

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/generate_lumina_day2.py'
      - '.github/workflows/generate-lumina-day2.yml'
      - 'scripts/day2-trigger.txt'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Generate video
        run: python scripts/generate_lumina_day2.py

      - name: Show output metadata
        run: ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 LUMINA_Dia2_voz_natural.mp4

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: LUMINA_Dia2_voz_natural
          path: LUMINA_Dia2_voz_natural.mp4
          if-no-files-found: error
          retention-days: 7
