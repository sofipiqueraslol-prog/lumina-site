<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mensajes | LUMINA</title><style>*{box-sizing:border-box}body{margin:0;background:#140928;color:#fff;font-family:Arial,sans-serif;min-height:100vh}.w{max-width:720px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.card{background:#ffffff12;border:1px solid #ffffff24;border-radius:20px;padding:16px;margin-top:14px}.messages{height:52vh;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px}.msg{max-width:82%;padding:12px 14px;border-radius:16px;line-height:1.4;white-space:pre-wrap}.patient{align-self:flex-end;background:#8f54d8}.professional{align-self:flex-start;background:#ffffff18}.time{font-size:11px;opacity:.7;margin-top:6px}textarea{width:100%;min-height:90px;border-radius:14px;border:1px solid #ffffff2a;background:#ffffff10;color:#fff;padding:12px;font:inherit}button,a{border:0;border-radius:12px;padding:11px 14px;font-weight:800;text-decoration:none;cursor:pointer}.pri{background:#a667f1;color:#fff}.soft{background:#ffffff15;color:#fff}.row{display:flex;gap:8px;align-items:center}.mut{color:#cfc3df}.empty{text-align:center;color:#cfc3df;padding:30px}</style></head><body><main class="w"><div class="top"><div><h1>Mensajes</h1><div class="mut" id="name"></div></div><a class="soft" href="app.html">Volver</a></div><section class="card"><div id="messages" class="messages"><div class="empty">Cargando…</div></div></section><section class="card"><textarea id="body" maxlength="4000" placeholder="Escribile a tu psicóloga…"></textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><button id="send" class="pri">Enviar mensaje</button></div><div id="status" class="mut"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const sb=supabase.createClient(LUMINA_CONFIG.SUPABASE_URL,LUMINA_CONFIG.SUPABASE_ANON_KEY),token=localStorage.getItem('lumina:patient_session'),$=id=>document.getElementById(id);if(!token)location.href='index.html';$('name').textContent=localStorage.getItem('lumina:user')||'Espacio privado';function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){const {data,error}=await sb.rpc('patient_list_messages',{p_token:token});if(error){$('messages').innerHTML='<div class="empty">La mensajería todavía no está activada.</div>';return}$('messages').innerHTML=(data||[]).length?(data||[]).map(m=>`<div class="msg ${m.sender}">${esc(m.body)}<div class="time">${new Date(m.created_at).toLocaleString('es-UY')}</div></div>`).join(''):'<div class="empty">Todavía no hay mensajes.</div>';$('messages').scrollTop=$('messages').scrollHeight}async function send(){const body=$('body').value.trim();if(!body)return;$('send').disabled=true;$('status').textContent='Enviando…';const {data,error}=await sb.rpc('patient_send_message',{p_token:token,p_body:body});$('send').disabled=false;if(error||!data?.ok){$('status').textContent=data?.message||error?.message||'No se pudo enviar.';return}$('body').value='';$('status').textContent='Mensaje enviado.';await load()}$('send').onclick=send;load();setInterval(load,15000);</script></body></html>
