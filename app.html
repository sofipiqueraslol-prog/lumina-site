<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUMINA Bienestar</title><style>html,body{margin:0;width:100%;height:100%;background:#140928;font-family:Arial;color:white}#loading{height:100%;display:grid;place-items:center;text-align:center;padding:24px}iframe{border:0;width:100%;height:100%;display:none}.error{max-width:430px}.messages{position:fixed;right:18px;bottom:18px;z-index:99;background:#8f54d8;color:#fff;text-decoration:none;padding:14px 18px;border-radius:999px;font-weight:800;box-shadow:0 12px 35px #0007;display:none}</style></head><body><div id="loading"><div class="error"><h1>LUMINA</h1><p>Verificando tu acceso privado…</p></div></div><iframe id="app" title="LUMINA Bienestar"></iframe><a id="messages" class="messages" href="mensajes-paciente.html">💬 Mensajes</a><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const sb=supabase.createClient(LUMINA_CONFIG.SUPABASE_URL,LUMINA_CONFIG.SUPABASE_ANON_KEY);(async()=>{const token=localStorage.getItem('lumina:patient_session');if(!token){location.href='index.html';return}const {data,error}=await sb.rpc('validate_patient_session',{p_token:token});if(error||!data||!data.ok){localStorage.removeItem('lumina:patient_session');document.getElementById('loading').innerHTML='<div class="error"><h1>Acceso vencido</h1><p>Solicitá un nuevo código a tu psicóloga.</p><button onclick="location.href=\'index.html\'">Volver al ingreso</button></div>';return}const frame=document.getElementById('app');frame.src='https://lumina-bienestar-otvdt82qm-lummina369-9311s-projects.vercel.app/?version=7';frame.onload=()=>{document.getElementById('loading').style.display='none';frame.style.display='block';document.getElementById('messages').style.display='block'}})();</script></body></html>
