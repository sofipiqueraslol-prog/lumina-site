<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso privado | LUMINA</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#140928,#32165f);font-family:Arial,sans-serif;color:#24163b;padding:20px}.card{width:min(430px,100%);background:#fff;border-radius:26px;padding:32px;box-shadow:0 24px 80px #0006;text-align:center}.brand{font-size:32px;font-weight:900;letter-spacing:4px;color:#6d37a0}p{color:#756881;line-height:1.5}input{width:100%;padding:15px;border:1px solid #d8cee4;border-radius:14px;font-size:16px;margin-top:10px}button{width:100%;padding:15px;border:0;border-radius:14px;background:#6d37a0;color:#fff;font-size:16px;font-weight:800;margin-top:12px;cursor:pointer}.error{display:none;color:#b42318;background:#fef3f2;padding:10px;border-radius:10px;margin-top:12px}.small{font-size:12px}</style></head><body><main class="card"><div class="brand">LUMINA</div><p>Espacio privado para pacientes. Ingresá el código personal entregado por tu psicóloga.</p><input id="code" autocomplete="one-time-code" placeholder="Código de acceso"><button id="enter">Ingresar</button><div id="error" class="error"></div><p class="small">El código es personal. No lo compartas.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const cfg=window.LUMINA_CONFIG;const sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);const err=document.getElementById('error');async function login(){err.style.display='none';const code=document.getElementById('code').value.trim().toUpperCase();if(!code){err.textContent='Escribí tu código.';err.style.display='block';return}const {data,error}=await sb.rpc('patient_login',{p_code:code,p_user_agent:navigator.userAgent});if(error||!data||!data.ok){err.textContent=(data&&data.message)||'Código incorrecto, vencido o suspendido.';err.style.display='block';return}localStorage.setItem('lumina:patient_session',data.session_token);localStorage.setItem('lumina:user',data.patient_name);location.href='app.html'}document.getElementById('enter').onclick=login;document.getElementById('code').addEventListener('keydown',e=>{if(e.key==='Enter')login()});</script></body></html>
