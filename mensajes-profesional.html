<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mensajes profesionales | LUMINA</title><style>*{box-sizing:border-box}body{margin:0;background:#140928;color:#fff;font-family:Arial,sans-serif;min-height:100vh}.w{max-width:1050px;margin:auto;padding:20px}.top,.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.grid{display:grid;grid-template-columns:310px 1fr;gap:14px}.card{background:#ffffff12;border:1px solid #ffffff24;border-radius:20px;padding:14px}.patients{max-height:70vh;overflow:auto}.patient{display:block;width:100%;text-align:left;background:#ffffff0d;color:#fff;border:0;border-radius:13px;padding:12px;margin-bottom:8px;cursor:pointer}.patient.active{background:#8f54d8}.mut{color:#cfc3df}.messages{height:48vh;overflow:auto;display:flex;flex-direction:column;gap:10px}.msg{max-width:82%;padding:12px 14px;border-radius:16px;white-space:pre-wrap}.patientmsg{align-self:flex-start;background:#ffffff18}.professional{align-self:flex-end;background:#8f54d8}.time{font-size:11px;opacity:.7;margin-top:6px}textarea,input{width:100%;border-radius:13px;border:1px solid #ffffff2a;background:#ffffff10;color:#fff;padding:12px;font:inherit}button,a{border:0;border-radius:12px;padding:11px 14px;font-weight:800;text-decoration:none;cursor:pointer}.pri{background:#a667f1;color:#fff}.soft{background:#ffffff15;color:#fff}.hidden{display:none}@media(max-width:760px){.grid{grid-template-columns:1fr}.patients{max-height:220px}}</style></head><body><main class="w"><div class="top"><div><h1>Mensajes de pacientes</h1><div class="mut">Bandeja privada de LUMINA</div></div><a class="soft" href="admin.html">Volver al panel</a></div><section id="login" class="card" style="margin-top:14px"><input id="password" type="password" placeholder="Tu contraseña"><button id="enter" class="pri" style="margin-top:10px">Ingresar</button><div id="loginError" class="mut"></div></section><section id="panel" class="grid hidden" style="margin-top:14px"><aside class="card"><div class="row"><h2>Pacientes</h2><button id="refresh" class="soft">Actualizar</button></div><div id="patients" class="patients"></div></aside><section class="card"><h2 id="title">Elegí una paciente</h2><div id="messages" class="messages"><div class="mut">Los mensajes aparecerán aquí.</div></div><textarea id="body" maxlength="4000" placeholder="Escribí una respuesta…" style="margin-top:12px"></textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><button id="send" class="pri">Enviar</button></div><div id="status" class="mut"></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const sb=supabase.createClient(LUMINA_CONFIG.SUPABASE_URL,LUMINA_CONFIG.SUPABASE_ANON_KEY),$=id=>document.getElementById(id);let current=null,patients=[];function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function auth(){const {data}=await sb.auth.getSession();if(data.session)return show();}$('enter').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:LUMINA_CONFIG.ADMIN_EMAIL,password:$('password').value});if(error){$('loginError').textContent=error.message;return}show()};async function show(){$('login').classList.add('hidden');$('panel').classList.remove('hidden');await loadPatients()}async function loadPatients(){const {data,error}=await sb.from('patients').select('id,name,active,last_access_at').order('name');if(error){$('patients').innerHTML='<div class="mut">'+esc(error.message)+'</div>';return}patients=data||[];$('patients').innerHTML=patients.map(p=>`<button class="patient ${current===p.id?'active':''}" data-id="${p.id}"><b>${esc(p.name)}</b><div class="mut">${p.active?'Activa':'Suspendida'} · ${p.last_access_at?new Date(p.last_access_at).toLocaleString('es-UY'):'Sin ingresos'}</div></button>`).join('')||'<div class="mut">No hay pacientes.</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>selectPatient(b.dataset.id))}async function selectPatient(id){current=id;const p=patients.find(x=>x.id===id);$('title').textContent=p?.name||'Paciente';await loadPatients();await loadMessages()}async function loadMessages(){if(!current)return;const {data,error}=await sb.from('patient_messages').select('*').eq('patient_id',current).order('created_at');if(error){$('messages').innerHTML='<div class="mut">La mensajería todavía no está activada.</div>';return}$('messages').innerHTML=(data||[]).length?(data||[]).map(m=>`<div class="msg ${m.sender==='patient'?'patientmsg':'professional'}">${esc(m.body)}<div class="time">${new Date(m.created_at).toLocaleString('es-UY')}</div></div>`).join(''):'<div class="mut">Todavía no hay mensajes.</div>';$('messages').scrollTop=$('messages').scrollHeight;await sb.from('patient_messages').update({read_at:new Date().toISOString()}).eq('patient_id',current).eq('sender','patient').is('read_at',null)}$('send').onclick=async()=>{const body=$('body').value.trim();if(!current||!body)return;const {error}=await sb.from('patient_messages').insert({patient_id:current,sender:'professional',body});if(error){$('status').textContent=error.message;return}$('body').value='';$('status').textContent='Mensaje enviado.';loadMessages()};$('refresh').onclick=()=>{loadPatients();loadMessages()};auth();setInterval(()=>{if(current)loadMessages()},15000);</script></body></html>
